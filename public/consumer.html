<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanSetu — Consumer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex; flex-direction:column; height:100vh; overflow:hidden;">
  <!-- Top bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 32px; border-bottom:1px solid #232f1c;">
    <div class="brand"><span class="dot"></span>KisanSetu</div>
    <div style="display:flex; gap:10px; align-items:center;">
      <span id="consumer-name" style="font-size:.88rem; font-weight:600;"></span>
      <button class="exit-btn" onclick="KS_AUTH.signOut()">🚪 Sign Out</button>
    </div>
  </div>
  
  <!-- Navigation tabs -->
  <header class="consumer-top">
    <div class="search-wrap">
      <span>🔍</span>
      <input type="text" id="consumer-search" placeholder="Search crops, farmers…" oninput="handleSearch()">
    </div>
    <div class="consumer-tabs" id="consumer-tabs">
      <button class="ctab active" data-ctab="browse">🛒 Browse</button>
      <button class="ctab" data-ctab="nearby">📍 Nearby</button>
      <button class="ctab" data-ctab="chat">💬 Chat</button>
      <button class="ctab" data-ctab="profile">👤 Profile</button>
    </div>
    <button class="btn btn-ghost cart-fab" onclick="openCart()">🛍️ Cart <span class="cart-count hidden" id="cart-count">0</span></button>
  </header>
  
  <!-- Main content -->
  <div class="main-scroll" id="consumer-content" style="flex:1;"></div>
  
  <!-- Cart Drawer -->
  <div class="drawer" id="cart-drawer">
    <div class="drawer-head"><h3 style="font-size:1.1rem;">Your cart</h3><button class="drawer-close" onclick="closeCart()">✕</button></div>
    <div class="drawer-body" id="cart-body"></div>
    <div class="drawer-foot" id="cart-foot"></div>
  </div>
  
  <!-- Chat Drawer -->
  <div class="drawer" id="chat-drawer">
    <div class="drawer-head">
      <div class="chat-header-info"><span id="chat-avatar">👤</span><div><div style="font-weight:700; font-size:.9rem;" id="chat-name">User</div><div class="lr-sub" id="chat-status">Online</div></div></div>
      <button class="drawer-close" onclick="closeChat()">✕</button>
    </div>
    <div class="drawer-body"><div class="chat-msgs" id="chat-msgs"></div></div>
    <div class="drawer-foot">
      <div class="chat-input-row">
        <input type="text" class="plain" id="chat-input" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendChatMessage()">
        <button class="btn btn-water btn-sm" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>
  
  <div id="toast-stack"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/consumer-app.js"></script>
</body>
</html>
